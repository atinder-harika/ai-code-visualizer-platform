name: Platform Integration CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: TypeScript Check
        working-directory: ./frontend
        run: npx tsc --noEmit
      
      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

  test-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Dependencies
        working-directory: ./backend/api-gateway
        run: |
          pip install -r requirements.txt
          pip install pytest httpx
      
      - name: Run Gateway Tests
        working-directory: ./backend/api-gateway
        run: pytest

  integration-test:
    runs-on: ubuntu-latest
    needs: [lint-frontend, test-gateway]
    steps:
      - uses: actions/checkout@v3
      
      - name: Start Services
        run: docker-compose up -d
      
      - name: Wait for Services
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8000/health; do sleep 2; done'
      
      - name: Run Integration Tests
        run: |
          curl -X POST http://localhost:8000/api/analyze \
            -H "Content-Type: application/json" \
            -d '{"repositoryUrl":"https://github.com/test/repo","branch":"main"}'
      
      - name: Check Service Status
        run: curl http://localhost:8000/api/services/status
      
      - name: Stop Services
        if: always()
        run: docker-compose down

  build-images:
    runs-on: ubuntu-latest
    needs: [integration-test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      
      - name: Build Frontend Image
        run: docker build -t ai-visualizer-frontend:${{ github.sha }} ./frontend
      
      - name: Build Gateway Image
        run: docker build -t ai-visualizer-gateway:${{ github.sha }} ./backend/api-gateway
      
      - name: Test Images
        run: |
          docker run -d --name frontend-test -p 3000:3000 ai-visualizer-frontend:${{ github.sha }}
          docker run -d --name gateway-test -p 8000:8000 ai-visualizer-gateway:${{ github.sha }}
          sleep 10
          docker ps
          docker stop frontend-test gateway-test
